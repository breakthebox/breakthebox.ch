# ═══════════════════════════════════════════════════════════
# Docker Compose — Production Deployment (Traefik)
# ═══════════════════════════════════════════════════════════
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml down
#   docker compose -f docker-compose.prod.yml logs -f app

services:
  # ─── PostgreSQL Database ───
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-breakthebox}
      POSTGRES_USER: ${DB_USER:-breakthebox}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-breakthebox}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── SvelteKit Application ───
  app:
    image: ghcr.io/breakthebox/breakthebox.ch:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-breakthebox}:${DB_PASSWORD}@db:5432/${DB_NAME:-breakthebox}
      - NODE_ENV=production
      # Kein ORIGIN: die App wird unter zwei Hostnamen ausgeliefert. Mit festem
      # ORIGIN würde `event.url` immer die kanonische Domain melden und der
      # CSRF-Check in hooks.server.ts jeden POST auf der zweiten Domain mit 403
      # abweisen. Stattdessen leitet adapter-node den Origin pro Request aus den
      # Proxy-Headern ab, die Traefik selbst setzt (und dabei Client-Werte
      # überschreibt — deshalb sind sie vertrauenswürdig).
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      # adapter-node begrenzt Request-Bodies auf 512 KB — hochgesetzt, damit
      # Bild-Uploads bis zur App-Grenze (5 MB, /api/upload) durchkommen.
      - BODY_SIZE_LIMIT=6M
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - n8n_internal
    labels:
      - 'traefik.enable=true'
      # ─── App-Router — kanonische Domain www.brigittehulliger.ch ───
      - 'traefik.http.routers.breakthebox.rule=Host(`www.brigittehulliger.ch`)'
      - 'traefik.http.routers.breakthebox.entrypoints=websecure'
      - 'traefik.http.routers.breakthebox.tls=true'
      - 'traefik.http.routers.breakthebox.tls.certresolver=myresolver'
      - 'traefik.http.routers.breakthebox.tls.domains[0].main=www.brigittehulliger.ch'
      - 'traefik.http.services.breakthebox.loadbalancer.server.port=3000'
      - 'traefik.docker.network=n8n_internal'
      # ─── Redirect-Router — web.breakthebox.ch + Apex brigittehulliger.ch → kanonisch (301) ───
      # Ein SAN-Zertifikat für beide Alt-Hostnamen; die Middleware leitet um,
      # bevor die Anfrage die App erreicht (service=breakthebox nur, weil
      # Traefik einen Service verlangt). $$ escaped das $ vor Compose-Interpolation.
      - 'traefik.http.routers.btb-redirect.rule=Host(`web.breakthebox.ch`) || Host(`brigittehulliger.ch`)'
      - 'traefik.http.routers.btb-redirect.entrypoints=websecure'
      - 'traefik.http.routers.btb-redirect.tls=true'
      - 'traefik.http.routers.btb-redirect.tls.certresolver=myresolver'
      - 'traefik.http.routers.btb-redirect.tls.domains[0].main=web.breakthebox.ch'
      - 'traefik.http.routers.btb-redirect.tls.domains[0].sans=brigittehulliger.ch'
      - 'traefik.http.routers.btb-redirect.service=breakthebox'
      - 'traefik.http.routers.btb-redirect.middlewares=btb-canonical'
      - 'traefik.http.middlewares.btb-canonical.redirectregex.regex=^https?://[^/]+/(.*)'
      - 'traefik.http.middlewares.btb-canonical.redirectregex.replacement=https://www.brigittehulliger.ch/$${1}'
      - 'traefik.http.middlewares.btb-canonical.redirectregex.permanent=true'
      # ─── Zweiter App-Router — www.breakthebox.ch liefert dieselbe App ───
      # Gleicher Service, gleiche DB, gleiches Upload-Volume: nur ein weiterer
      # Hostname auf denselben Container. Canonical, Sitemap und JSON-LD zeigen
      # weiterhin auf www.brigittehulliger.ch, weil SITE_URL aus PUBLIC_APP_URL
      # kommt und nicht aus dem Host — PUBLIC_APP_URL darf deshalb NICHT auf
      # breakthebox.ch geändert werden.
      - 'traefik.http.routers.btb-www.rule=Host(`www.breakthebox.ch`)'
      - 'traefik.http.routers.btb-www.entrypoints=websecure'
      - 'traefik.http.routers.btb-www.tls=true'
      - 'traefik.http.routers.btb-www.tls.certresolver=myresolver'
      - 'traefik.http.routers.btb-www.tls.domains[0].main=www.breakthebox.ch'
      - 'traefik.http.routers.btb-www.service=breakthebox'
      # ─── Apex breakthebox.ch → www.breakthebox.ch (301) ───
      # Innerhalb der Marke auf www vereinheitlichen, analog zu
      # brigittehulliger.ch → www.brigittehulliger.ch weiter oben.
      - 'traefik.http.routers.btb-apex.rule=Host(`breakthebox.ch`)'
      - 'traefik.http.routers.btb-apex.entrypoints=websecure'
      - 'traefik.http.routers.btb-apex.tls=true'
      - 'traefik.http.routers.btb-apex.tls.certresolver=myresolver'
      - 'traefik.http.routers.btb-apex.tls.domains[0].main=breakthebox.ch'
      - 'traefik.http.routers.btb-apex.service=breakthebox'
      - 'traefik.http.routers.btb-apex.middlewares=btb-www-canonical'
      - 'traefik.http.middlewares.btb-www-canonical.redirectregex.regex=^https?://[^/]+/(.*)'
      - 'traefik.http.middlewares.btb-www-canonical.redirectregex.replacement=https://www.breakthebox.ch/$${1}'
      - 'traefik.http.middlewares.btb-www-canonical.redirectregex.permanent=true'

volumes:
  pgdata:
  uploads:

networks:
  internal:
  n8n_internal:
    external: true
